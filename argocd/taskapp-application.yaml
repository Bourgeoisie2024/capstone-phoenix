apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: taskapp
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Bourgeoisie2024/capstone-phoenix.git
    targetRevision: capstone-build
    path: manifests/base

  destination:
    server: https://kubernetes.default.svc
    namespace: taskapp

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true

  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: backend
      namespace: taskapp
      jsonPointers:
        - /spec/replicas
