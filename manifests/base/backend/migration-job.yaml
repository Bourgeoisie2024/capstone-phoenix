apiVersion: batch/v1
kind: Job

metadata:
  name: backend-migration
  namespace: taskapp

spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app: backend
        component: migration

    spec:
      restartPolicy: Never

      containers:
        - name: migration

          image: ghcr.io/ts-a-devops/taskapp-backend:5d6b8fc

          imagePullPolicy: IfNotPresent

          command:
            - alembic

          args:
            - upgrade
            - head

          envFrom:
            - configMapRef:
                name: taskapp-config

            - secretRef:
                name: taskapp-secret
