apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: taskapp

spec:
  replicas: 3
  revisionHistoryLimit: 2

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:

      imagePullSecrets:
        - name: ghcr-secret

      topologySpreadConstraints:
        - maxSkew: 1

          topologyKey: kubernetes.io/hostname

          whenUnsatisfiable: ScheduleAnyway

          labelSelector:
            matchLabels:
              app: frontend

      containers:
        - name: frontend

          image: ghcr.io/bourgeoisie2024/project-phoenix-frontend:v1.0.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            tcpSocket:
              port: 80

            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 80

            initialDelaySeconds: 30
            periodSeconds: 10
